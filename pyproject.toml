[project]
name = "repo-onboard-ai"
version = "0.1.0"
description = "Generate onboarding guides for software repositories."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Repo Onboard AI contributors" }]
keywords = ["ai", "onboarding", "repository", "documentation", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/niuxinhuai/repo-onboard-ai"
Repository = "https://github.com/niuxinhuai/repo-onboard-ai"
Issues = "https://github.com/niuxinhuai/repo-onboard-ai/issues"

[project.scripts]
repo-onboard-ai = "repo_onboard_ai.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
